<style>
:root {
--bg: #000;
--text: #f2f2ff;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
color: var(--text);
background: var(--bg);
font-family: system-ui, sans-serif;
}
body {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
overflow: hidden;
}
video {
max-width: 100%;
max-height: 100%;
object-fit: contain;
cursor: pointer;
border-radius: 8px;
background: #000;
}
canvas {
display: none;
}
video::-webkit-media-controls,
video::-moz-media-controls {
display: none !important;
}
</style>

<body>
<canvas id="mirror"></canvas>
<video id="camera" autoplay playsinline muted></video>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('mirror');
const ctx = canvas.getContext('2d');
let stage = 0;

async function startCamera() {
try {
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: 'user' },
audio: false
});

const input = document.createElement('video');
input.srcObject = stream;
input.play();

input.addEventListener('loadedmetadata', () => {
canvas.width = input.videoWidth;
canvas.height = input.videoHeight;

const draw = () => {
ctx.save();
ctx.scale(-1, 1);
ctx.drawImage(input, -canvas.width, 0, canvas.width, canvas.height);
ctx.restore();
requestAnimationFrame(draw);
};
draw();

const mirroredStream = canvas.captureStream(30);
video.srcObject = mirroredStream;
video.play();
});

} catch (err) {
console.error('Camera access denied:', err);
}
}

video.addEventListener('pause', async () => {
try { await video.play(); } catch {}
});

video.addEventListener('click', async () => {
try {
if (stage === 0) {
await video.requestFullscreen();
stage = 1;
} else if (stage === 1) {
await video.requestPictureInPicture();
stage = 2;
}
} catch (err) {
console.error(err);
}
});

video.addEventListener('leavepictureinpicture', async () => {
stage = 0;
if (document.fullscreenElement) await document.exitFullscreen();
if (video.paused) {
try { await video.play(); } catch {}
}
});

startCamera();
</script>
<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./sw.js')
.then(()=>console.log('SW registered'))
.catch(err=>console.warn('SW failed',err));
}
</script>
